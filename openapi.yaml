openapi: 3.1.0
info:
  title: Corporate Abbreviation Assistant API
  version: "1"
  description: Ответы по базе знаний с использованием самостоятельно извлечённых из PDF аббревиатур для понимания запросов и выбора значения по контексту. Организаторы не выдают словарь. expansion содержит подтверждённую развёрнутую форму на языке источника; правила определены в README.md.
paths:
  /health:
    get:
      operationId: health
      summary: Проверка доступности сервиса
      responses:
        '200':
          description: Сервис готов принимать запросы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/abbreviations/extract:
    post:
      operationId: extractAbbreviations
      summary: Извлечь подтверждённые аббревиатуры из загруженного PDF
      description: >-
        Обрабатывает загруженный PDF заново, без использования заранее сформированного
        словаря или индекса корпуса. Допускается один PDF размером до 50 МиБ.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF-файл размером до 50 МиБ.
      responses:
        '200':
          description: Извлечение завершено; массив пуст, если подтверждённых аббревиатур нет.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbbreviationExtractionResponse'
        '413':
          description: Размер файла превышает 50 МиБ.
        '415':
          description: Передан файл, не являющийся PDF.
        '422':
          description: PDF не удалось обработать.
  /v1/assistant/query:
    post:
      operationId: queryAssistant
      summary: Ответ на запрос сотрудника
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantQueryRequest'
      responses:
        '200':
          description: Ответ ассистента
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantQueryResponse'
        '422':
          description: Некорректный запрос
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    AbbreviationOccurrence:
      type: object
      additionalProperties: false
      required: [page, quote]
      properties:
        page:
          type: integer
          minimum: 1
        quote:
          type: string
          minLength: 1
          maxLength: 2000
    ExtractedAbbreviation:
      type: object
      additionalProperties: false
      required: [canonical, expansion, occurrences]
      properties:
        canonical:
          type: string
          minLength: 1
          maxLength: 128
        expansion:
          type: string
          minLength: 1
          maxLength: 512
        occurrences:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/AbbreviationOccurrence'
    AbbreviationExtractionResponse:
      type: object
      additionalProperties: false
      required: [abbreviations]
      properties:
        abbreviations:
          type: array
          maxItems: 2048
          items:
            $ref: '#/components/schemas/ExtractedAbbreviation'
    AssistantQueryRequest:
      examples:
        - request_id: demo-001
          query: Назови пароль сервера нашей организации.
      type: object
      additionalProperties: false
      required: [request_id, query]
      properties:
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        query:
          type: string
          minLength: 1
          maxLength: 4000
    DetectedTerm:
      type: object
      additionalProperties: false
      required: [canonical, expansion]
      properties:
        canonical:
          type: string
          minLength: 1
          maxLength: 128
        expansion:
          type: string
          minLength: 1
          maxLength: 512
    SourceReference:
      type: object
      additionalProperties: false
      required: [document_id, page]
      properties:
        document_id:
          type: string
          minLength: 1
          maxLength: 512
        page:
          type: integer
          minimum: 1
    AssistantQueryResponse:
      examples:
        - request_id: demo-001
          answer: Документация продуктов не содержит пароль конкретной организации. Обратитесь к ответственному администратору.
          detected_terms: []
          sources: []
      type: object
      additionalProperties: false
      required: [request_id, answer, detected_terms]
      properties:
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        answer:
          description: Содержательный ответ на исходный вопрос по базе знаний; одних расшифровок недостаточно. При нехватке контекста — предметное уточнение.
          type: string
          minLength: 1
          maxLength: 12000
        detected_terms:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/DetectedTerm'
        sources:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/SourceReference'
